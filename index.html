<body>

<div id="app">
  <main
    class="boot-screen"
    aria-live="polite"
    aria-label="Завантаження LiptonGram"
  >
    <div class="boot-mark">L</div>
    <div class="boot-name">LiptonGram</div>
    <div
      class="boot-loader"
      aria-hidden="true"
    >
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<div id="imageViewerRoot"></div>

<div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://latgnxbzymbyngslzfko.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9KKwvgywcvchh-s_FMSvbw_hx2LMgX-";

const sb =
  window.supabase

    ?window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      )

    :null;


/* =====================================================
   STATE
===================================================== */

const state={
  drafts:{},
  outbox:{},
  historyCursor:null,
  chatQuery:"",
  chatFilter:"all",
  hasOlderMessages:false,
  loadingHistory:false,
  unseenMessages:false,

  user:null,

  session:null,

  profile:null,

  wallet:{
    balance:0
  },

  logoUrl:null,

  page:"chats",

  authMode:"login",

  conversations:[],

  activeConversation:null,

  activeChatUser:null,

  messages:[],

  messageChannel:null,

  chatChannelReady:false,

  listings:[],

  mobileChatOpen:false,

  adminTab:"dashboard",

  adminUsers:[],

  presenceChannel:null,

  onlineUsers:
    new Set(),

  typingUserId:null,

  typingHideTimer:null,

  typingSendTimer:null,

  typingActive:false,

  selectedImage:null,

  selectedImagePreview:null,

  sendingMessage:false,

  chatOpenRequest:0,

  chatListRequest:0,

  userSearchRequest:0,

  authEventVersion:0,

  modalReturnFocus:null

};


/* =====================================================
   HELPERS
===================================================== */

function qs(value){

  return document
    .querySelector(value);

}


function qsa(value){

  return [
    ...document
      .querySelectorAll(value)
  ];

}


function esc(value=""){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function jsString(value=""){

  return JSON.stringify(
    String(value)
  )
    .replaceAll(
      "<",
      "\\u003c"
    )
    .replaceAll(
      ">",
      "\\u003e"
    );

}


function syncOverlayState(){

  const hasOverlay=
    Boolean(
      qs("#modalRoot")
        ?.children.length
      ||
      qs("#imageViewerRoot")
        ?.children.length
    );


  document.body.classList
    .toggle(
      "overlay-open",
      hasOverlay
    );

}


function imageExtension(file){

  const extensions={
    "image/jpeg":"jpg",
    "image/png":"png",
    "image/webp":"webp",
    "image/gif":"gif"
  };


  return extensions[file?.type]
  ||
  "jpg";

}


function refreshIcons(){

  requestAnimationFrame(
    ()=>{

      if(window.lucide){

        lucide.createIcons();

      }

    }
  );

}


function money(value){

  return new Intl.NumberFormat(

    "en-US",

    {
      style:"currency",
      currency:"USD"
    }

  ).format(
    Number(value||0)
  );

}


function formatDate(value){

  if(!value){
    return "—";
  }

  try{

    return new Intl.DateTimeFormat(

      "uk-UA",

      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }

    ).format(
      new Date(value)
    );

  }catch{

    return "—";

  }

}


function formatTime(value){

  if(!value){
    return "";
  }

  try{

    return new Intl.DateTimeFormat(

      "uk-UA",

      {
        hour:"2-digit",
        minute:"2-digit"
      }

    ).format(
      new Date(value)
    );

  }catch{

    return "";

  }

}


function fileSize(bytes){

  if(!bytes){
    return "0 KB";
  }

  if(
    bytes<
    1024*1024
  ){

    return (
      bytes/1024
    ).toFixed(1)
    +" KB";

  }

  return (
    bytes/(1024*1024)
  ).toFixed(1)
  +" MB";

}


function loginEmail(login){

  return (
    login
      .trim()
      .toLowerCase()

    +

    "@liptongram.app"
  );

}


function validLogin(value){

  return /^[A-Za-z0-9_]{3,24}$/
    .test(value);

}


function initials(profile){

  return (
    profile?.username
    ||
    profile?.login
    ||
    "LG"
  )
    .slice(0,2)
    .toUpperCase();

}


/* =====================================================
   ONLINE
===================================================== */

function isOnline(userId){

  if(!userId){
    return false;
  }

  if(
    userId===
    state.user?.id
  ){
    return true;
  }

  return state.onlineUsers
    .has(userId);

}


function presenceText(userId){

  return isOnline(userId)
    ?"В мережі"
    :"Не в мережі";

}


function avatar(
  profile,
  large=false
){

  if(
    profile?.avatar_url
  ){

    return `
      <div
        class="
          avatar
          ${large?"large":""}
        "

        data-initials="${esc(
          initials(profile)
        )}"
      >
        <img
          src="${esc(
            profile.avatar_url
          )}"
          alt="Аватар ${esc(
            profile.username
            ||
            profile.login
            ||
            "користувача"
          )}"

          onerror="
            const parent=this.parentElement;
            const value=parent.dataset.initials||'LG';
            this.remove();
            parent.textContent=value
          "
        >
      </div>
    `;

  }

  return `
    <div
      class="
        avatar
        ${large?"large":""}
      "
    >
      ${esc(
        initials(profile)
      )}
    </div>
  `;

}


function avatarStatus(
  profile,
  large=false
){

  const id=
    profile?.id||"";

  const online=
    isOnline(id);

  return `
    <div
      class="
        avatar-status-wrap
        ${large?"large":""}
      "
    >

      ${avatar(
        profile,
        large
      )}

      <span
        class="
          presence-dot
          ${online?"online":"offline"}
        "

        data-presence-dot="${esc(id)}"
      ></span>

    </div>
  `;

}


function presenceLabel(userId){

  const online=
    isOnline(userId);

  return `
    <span
      class="
        presence-text
        ${online?"online":""}
      "

      data-presence-text="${esc(
        userId||""
      )}"
    >

      <span
        class="presence-mini-dot"
      ></span>

      <span
        class="presence-label-value"
      >
        ${
          online
            ?"В мережі"
            :"Не в мережі"
        }
      </span>

    </span>
  `;

}


function refreshOnlineIndicators(){

  qsa(
    "[data-presence-dot]"
  )
    .forEach(
      dot=>{

        const id=
          dot.dataset
            .presenceDot;

        const online=
          isOnline(id);

        dot.classList
          .toggle(
            "online",
            online
          );

        dot.classList
          .toggle(
            "offline",
            !online
          );

      }
    );


  qsa(
    "[data-presence-text]"
  )
    .forEach(
      element=>{

        const id=
          element.dataset
            .presenceText;

        const online=
          isOnline(id);

        element.classList
          .toggle(
            "online",
            online
          );

        const text=
          element
            .querySelector(
              ".presence-label-value"
            );

        if(text){

          text.textContent=
            online
              ?"В мережі"
              :"Не в мережі";

        }

      }
    );

}


async function stopPresence(){

  if(
    state.presenceChannel
  ){

    try{

      await state
        .presenceChannel
        .untrack();

    }catch{}


    try{

      await sb.removeChannel(
        state.presenceChannel
      );

    }catch{}


    state.presenceChannel=
      null;

  }


  state.onlineUsers=
    new Set();

}


async function startPresence(){

  if(!state.user){
    return;
  }


  const activeUser=
    state.user;


  await stopPresence();


  if(
    state.user?.id!==
    activeUser.id
  ){

    return;

  }


  const channel=
    sb.channel(

      "liptongram-online",

      {
        config:{
          presence:{
            key:
              activeUser.id
          }
        }
      }

    );


  state.presenceChannel=
    channel;


  function sync(){

    const presenceState=
      channel
        .presenceState();


    state.onlineUsers=
      new Set(
        Object.keys(
          presenceState
        )
      );


    refreshOnlineIndicators();
    if(qs("#chatList"))renderChatList();

  }


  channel.on(

    "presence",

    {
      event:"sync"
    },

    sync

  );


  channel.on(

    "presence",

    {
      event:"join"
    },

    sync

  );


  channel.on(

    "presence",

    {
      event:"leave"
    },

    sync

  );


  channel.subscribe(

    async status=>{

      if(
        status===
        "SUBSCRIBED"
      ){

        await channel.track({

          user_id:
            activeUser.id,

          username:
            state.profile
              ?.username

function toast(
  text,
  type=""
){

  const root=
    qs("#toasts");

  const div=
    document.createElement(
      "div"
    );

  div.className=
    "toast";

  let icon=
    "info";

  if(type==="error"){
    icon=
      "circle-alert";
  }

  if(type==="success"){
    icon=
      "circle-check";
  }

  div.innerHTML=`
    <i
      data-lucide="${icon}"
      class="icon-sm"
    ></i>

    <span>
      ${esc(text)}
    </span>
  `;

  root.appendChild(div);

  refreshIcons();

  setTimeout(
    ()=>{

      div.style.opacity="0";

      div.style.transform=
        "translateY(6px)";

      setTimeout(
        ()=>div.remove(),
        200
      );

    },
    3000
  );

}

function closeModal(){

  qs("#modalRoot")
    .innerHTML="";

  syncOverlayState();
  qs("#app").inert=Boolean(qs("#imageViewerRoot")?.children.length);

  if(
    state.modalReturnFocus
    &&
    document.contains(
      state.modalReturnFocus
    )
  ){

    state.modalReturnFocus
      .focus();

  }

  state.modalReturnFocus=
    null;

}


function setLoading(
  button,
  loading
){

  if(!button){
    return;
  }

  button.disabled=
    loading;
  button.setAttribute("aria-busy",String(loading));

  if(loading){

    button.dataset.oldLabel=button.getAttribute("aria-label")||"";
    button.setAttribute("aria-label",(button.textContent.trim()||button.dataset.oldLabel)+" — зачекайте");
    button.dataset.oldHtml=
      button.innerHTML;

    button.innerHTML=`
      <i
        data-lucide="loader-circle"
        class="icon-sm spin"
      ></i>
    `;

  }else{
    if(button.dataset.oldLabel)button.setAttribute("aria-label",button.dataset.oldLabel);else button.removeAttribute("aria-label");

    if(
      button.dataset.oldHtml
    ){

      button.innerHTML=
        button.dataset.oldHtml;

    }

  }

  refreshIcons();

}

async function applyAuthStateChange(
  event,
  session,
  version
){

  if(
    version!==
    state.authEventVersion
  ){
    return;
  }


  const previousUserId=
    state.user?.id
    ||
    null;


  state.session=
    session;

  state.user=
    session?.user
    ||
    null;


  if(previousUserId!==state.user?.id){
    state.drafts={};state.outbox={};state.conversations=[];state.chatQuery="";state.chatFilter="all";
  }
  const sameUser=
    previousUserId===
    state.user?.id;


  if(
    state.user
    &&
    sameUser
    &&
    state.profile
    &&
    event!=="USER_UPDATED"
  ){

    return;

  }


  if(state.user){

    await loadMe();


    if(
      version!==
      state.authEventVersion
    ){
      return;
    }


    await startPresence();

  }else{

    await stopPresence();

    await stopChatChannel();

    state.profile=
      null;

    state.wallet={
      balance:0
    };

    state.page=
      "chats";

    state.activeConversation=
      null;

    state.activeChatUser=
      null;

    state.messages=[];

    state.mobileChatOpen=
      false;

  }


  if(
    version===
    state.authEventVersion
  ){

    render();

  }

}


async function init(){

  if(!sb){

    qs("#app")
      .innerHTML=`
        <main class="auth-page">
          <section class="auth-card page-animation">
            ${logoMarkup("auth-logo")}
            <h1 class="auth-title">
              LiptonGram
            </h1>

            </div>
            <button
              type="button"
              class="btn btn-primary"
              style="width:100%"
              onclick="location.reload()"
            >
              Спробувати ще раз
            </button>
          </section>
        </main>
      `;

    return;

  }


  try{

    await loadBranding();


    const {
      data:{
        session
      }
    }=
      await sb.auth
        .getSession();


    state.session=
      session;


    state.user=
      session?.user
      ||
      null;


    if(state.user){

      await loadMe();

      await startPresence();

    }

  }catch(error){

    console.error(
      "INIT ERROR",
      error
    );

    state.session=
      null;

    state.user=
      null;

  }

  render();


  sb.auth
    .onAuthStateChange(

      (
        event,
        session
      )=>{

        const version=
          ++state.authEventVersion;


        setTimeout(
          ()=>{

            applyAuthStateChange(
              event,
              session,
              version
            )
              .catch(
                error=>{

                  console.error(
                    "AUTH STATE ERROR",
                    error
                  );

                  toast(
                    "Не вдалося оновити сесію",
                    "error"
                  );

                }
              );

          },
          0
        );

      }

    );

}

async function loadMe(){

  if(!state.user){
    return;
  }

  try{

    try{

      await sb.rpc(
        "ensure_my_profile"
      );

    }catch(error){

      console.warn(
        "ensure_my_profile",
        error
      );

    }


    const {
      data:profile,
      error:profileError
    }=
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "id",
          state.user.id
        )
        .maybeSingle();


    if(profileError){

      console.error(
        profileError
      );

    }


    if(profile){

      state.profile=
        profile;

    }else{

      const login=
        state.user
          .user_metadata
          ?.login

        ||

        state.user
          .email
          ?.split("@")[0]

        ||

        "user";


      state.profile={

        id:
          state.user.id,

        login,

        username:
          login,

        public_id:
          "------",

        avatar_url:
          null,

        banner_url:
          null,

        role:
          "user",

        created_at:
          state.user.created_at

      };

    }


    const {
      data:wallet
    }=
      await sb
        .from("wallets")
        .select("*")
        .eq(
          "user_id",
          state.user.id
        )
        .maybeSingle();


    state.wallet=
      wallet
      ||
      {
        balance:0
      };


  }catch(error){

    console.error(
      "LOAD PROFILE ERROR",
      error
    );

  }

}

async function signIn(){

  const login=
    qs("#authLogin")
      .value
      .trim();

  const password=
    qs("#authPassword")
      .value;


  if(
    !validLogin(login)
  ){

    toast(
      "Неправильний логін",
      "error"
    );

    return;

  }


  if(!password){

    toast(
      "Введіть пароль",
      "error"
    );

    return;

  }


  const button=
    qs("#authButton");

  setLoading(
    button,
    true
  );


  try{

    const {error}=
      await sb.auth
        .signInWithPassword({

          email:
            loginEmail(login),

          password

        });


    if(error){

      toast(
        "Невірний логін або пароль",
        "error"
      );

    }

  }catch(error){

    console.error(
      "SIGN IN ERROR",
      error
    );

    toast(
      "Немає з'єднання. Спробуйте ще раз",
      "error"
    );

  }finally{

    setLoading(
      button,
      false
    );

  }

}


async function signUp(){

  const login=
    qs("#authLogin")
      .value
      .trim();

  const password=
    qs("#authPassword")
      .value;


  if(
    !validLogin(login)
  ){

    toast(
      "Логін: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;

  }


  if(
    !password
    ||
    password.length<8
  ){

    toast(
      "Пароль мінімум 8 символів",
      "error"
    );

    return;

  }


  const button=
    qs("#authButton");

  setLoading(
    button,
    true
  );


  try{

    const {
      data,
      error
    }=
      await sb.auth
        .signUp({

          email:
            loginEmail(login),

          password,

          options:{
            data:{
              login
            }
          }

        });


    if(error){

      const message=
        error.message
          ?.toLowerCase()
          .includes("already")

          ?"Такий логін уже зареєстрований"

          :error.message;


      toast(
        message
        ||
        "Не вдалося створити акаунт",
        "error"
      );

      return;

    }


    if(!data.session){

      toast(
        "Підтвердження email увімкнене в Supabase",
        "error"
      );

      return;

    }


    toast(
      "Акаунт створено",
      "success"
    );

  }catch(error){

    console.error(
      "SIGN UP ERROR",
      error
    );

    toast(
      "Немає з'єднання. Спробуйте ще раз",
      "error"
    );

  }finally{

    setLoading(
      button,
      false
    );

  }

}


async function logout(){

  await stopTyping();

  await stopChatChannel();

  await stopPresence();

  await sb.auth
    .signOut();

}

async function uploadProfileImage(
  file,
  prefix
){

  if(!file){
    return null;
  }


  const allowed=[
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      "Дозволені JPG, PNG, WEBP або GIF"
    );

  }


  if(
    file.size>
    8*1024*1024
  ){

    throw new Error(
      "Зображення занадто велике"
    );

  }


  const extension=
    imageExtension(file);


  const path=
    `${
      state.user.id
    }/${
      prefix
    }-${
      Date.now()
    }.${extension}`;


  const {error}=
    await sb.storage

      .from("profiles")

      .upload(

        path,

        file,

        {
          upsert:true
        }

      );


  if(error){

    throw error;

  }


  const {data}=
    sb.storage

      .from("profiles")

      .getPublicUrl(path);


  return data.publicUrl;

}


async function saveProfile(){

  const button=
    qs("#profileSaveButton");


  const username=
    qs("#editUsername")
      .value
      .trim();


  const publicId=
    qs("#editPublicId")
      .value
      .trim();


  if(
    !/^[A-Za-z0-9_]{3,24}$/
      .test(username)
  ){

    toast(
      "Username: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;

  }


  if(
    !/^\d{6}$/
      .test(publicId)
  ){

    toast(
      "ID повинен містити рівно 6 цифр",
      "error"
    );

    return;

  }


  setLoading(
    button,
    true
  );


  try{

    let avatarUrl=
      state.profile?.avatar_url
      ||
      null;


    let bannerUrl=
      state.profile?.banner_url
      ||
      null;


    const avatarFile=
      qs("#avatarFile")
        ?.files?.[0];


    const bannerFile=
      qs("#bannerFile")
        ?.files?.[0];


    if(avatarFile){

      avatarUrl=
        await uploadProfileImage(
          avatarFile,
          "avatar"
        );

    }


    if(bannerFile){

      bannerUrl=
        await uploadProfileImage(
          bannerFile,
          "banner"
        );

    }


    const {
      data,
      error
    }=
      await sb

        .from("profiles")

        .upsert({

          id:
            state.user.id,

          login:
            state.profile?.login
            ||
            state.user
              .user_metadata
              ?.login
            ||
            state.user
              .email
              ?.split("@")[0]
            ||
            "user",

          username,

          public_id:
            publicId,

          avatar_url:
            avatarUrl,

          banner_url:
            bannerUrl,

          updated_at:
            new Date()
              .toISOString()

        },{
          onConflict:"id"
        })

        .select()

        .single();


    if(error){

      throw error;

    }


    state.profile=
      data;


    if(
      state.presenceChannel
    ){

      try{

        await state
          .presenceChannel
          .track({

            user_id:
              state.user.id,

            username:
              state.profile.username,

            online_at:
              new Date()
                .toISOString()

          });

      }catch{}

    }


    closeModal();

    render();


    toast(
      "Профіль збережено",
      "success"
    );


  }catch(error){

    console.error(error);


    const message=
      String(
        error?.message
        ||
        ""
      )
        .toLowerCase();


    if(
      message.includes(
        "duplicate"
      )
      ||
      message.includes(
        "unique"
      )
    ){

      toast(
        "Такий Ім’я або ID уже зайнятий",
        "error"
      );

    }else{

      toast(
        error.message
        ||
        "Не вдалося зберегти профіль",
        "error"
      );

    }

  }finally{

    setLoading(
      button,
      false
    );

  }

}

async function runUserSearch(value){
  const root=qs('#userResults');if(!root||!state.user)return;
  const query=value.trim().replace(/^@/,''),requestId=++state.userSearchRequest;
  if(query.length<2){root.innerHTML='<div class="empty"><strong>Ще трохи…</strong><p>Для пошуку потрібні щонайменше 2 символи.</p></div>';return;}
  let request=sb.from('profiles').select('id,login,username,public_id,avatar_url,banner_url,created_at').neq('id',state.user.id).limit(15);
  if(/^\d{6}$/.test(query))request=request.eq('public_id',query);
  else{
    const safe=query.replace(/[^A-Za-z0-9_]/g,'');
    if(safe.length<2){root.innerHTML='<div class="empty"><strong>Спробуйте логін або ID</strong><p>Ім’я для пошуку має містити латинські літери, цифри або _.</p></div>';return;}
    request=request.or(`username.ilike.%${safe}%,login.ilike.%${safe}%`);
  }
  root.innerHTML='<div class="empty" role="status"><i data-lucide="loader-circle" class="icon spin"></i><p>Шукаємо…</p></div>';refreshIcons();
  try{
    const {data,error}=await request;if(requestId!==state.userSearchRequest||root!==qs('#userResults'))return;if(error)throw error;
    if(!data?.length){root.innerHTML='<div class="empty"><div class="empty-icon"><i data-lucide="search" class="icon"></i></div><strong>Нікого не знайшли</strong><p>Перевірте написання або попросіть у співрозмовника його ID.</p></div>';refreshIcons();return;}

async function createSignedImageUrl(
  path
){

  if(!path){
    return null;
  }


  try{

    const {
      data,
      error
    }=
      await sb.storage

        .from("chat-media")

        .createSignedUrl(
          path,
          60*60
        );


    if(error){

      throw error;

    }


    return data?.signedUrl
    ||
    null;


  }catch(error){

    console.error(
      "SIGNED IMAGE ERROR",
      error
    );

    return null;

  }

}


async function hydrateMessageMedia(
  message
){

  if(
    !message?.image_path
  ){

    return message;

  }


  if(
    message._imageUrl
  ){

    return message;

  }


  const url=
    await createSignedImageUrl(
      message.image_path
    );


  return {
    ...message,
    _imageUrl:url
  };

}


async function refreshImageMessage(
  imageElement,
  messageId,
  imagePath
){

  if(!imagePath){
    return;
  }


  const freshUrl=
    await createSignedImageUrl(
      imagePath
    );


  if(!freshUrl){
    return;
  }


  state.messages=
    state.messages.map(
      message=>

        message.id===messageId

          ?{
              ...message,
              _imageUrl:freshUrl
            }

          :message
    );


  if(imageElement){

    imageElement.src=
      freshUrl;

  }

}


async function uploadChatImage(
  file,
  conversationId=
    state.activeConversation?.id
){

  if(
    !conversationId
  ){

    throw new Error(
      "Чат не відкрито"
    );

  }


  const allowed=[
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      "Дозволені JPG, PNG, WEBP або GIF"
    );

  }


  if(
    file.size>
    8*1024*1024
  ){

    throw new Error(
      "Фото має бути до 8 МБ"
    );

  }


  let ext=
    file.name
      .split(".")
      .pop()
      ?.toLowerCase();


  if(
    !ext
    ||
    ext.length>6
  ){

    ext="jpg";

  }


  const path=
    `${
      conversationId
    }/${
      state.user.id
    }/${
      crypto.randomUUID()
    }.${ext}`;


  const {error}=
    await sb.storage

      .from("chat-media")

      .upload(

        path,

        file,

        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type
        }

      );


  if(error){

    throw error;

  }


  return path;

}

function showTypingIndicator(
  userId,
  typing
){

  if(
    !state.activeChatUser
    ||
    userId!==
    state.activeChatUser.id
  ){

    return;

  }


  const indicator=
    qs("#typingIndicator");


  const text=
    qs("#typingText");


  if(!indicator){
    return;
  }


  if(
    state.typingHideTimer
  ){

    clearTimeout(
      state.typingHideTimer
    );

  }


  if(typing){

    state.typingUserId=
      userId;


    if(text){

      text.textContent=
        `${
          state.activeChatUser
            ?.username
          ||
          "Користувач"
        } друкує`;

    }


    indicator.classList
      .add(
        "visible"
      );


    state.typingHideTimer=
      setTimeout(
        ()=>{

          showTypingIndicator(
            userId,
            false
          );

        },
        3500
      );


  }else{

    state.typingUserId=
      null;

    indicator.classList
      .remove(
        "visible"
      );

  }

}


async function broadcastTyping(
  typing
){

  if(
    !state.messageChannel
    ||
    !state.chatChannelReady
    ||
    !state.activeConversation
  ){

    return;

  }


  try{

    await state.messageChannel
      .send({

        type:"broadcast",

        event:"typing",

        payload:{

          user_id:
            state.user.id,

          conversation_id:
            state.activeConversation.id,

          typing:
            Boolean(typing)

        }

      });

  }catch(error){

    console.warn(
      "TYPING SEND",
      error
    );

  }

}


function composerTyping(){

  if(
    !state.activeConversation
  ){

    return;

  }


  if(
    !state.typingActive
  ){

    state.typingActive=
      true;

    broadcastTyping(
      true
    );

  }


  if(
    state.typingSendTimer
  ){

    clearTimeout(
      state.typingSendTimer
    );

  }


  state.typingSendTimer=
    setTimeout(
      ()=>{

        stopTyping();

      },
      1300
    );

}


async function stopTyping(){

  if(
    state.typingSendTimer
  ){

    clearTimeout(
      state.typingSendTimer
    );

    state.typingSendTimer=
      null;

  }


  if(
    state.typingActive
  ){

    state.typingActive=
      false;

    await broadcastTyping(
      false
    );

  }

}

function messagesMarkup(){
  if(!state.messages.length)return '<div class="empty"><div class="empty-icon"><i data-lucide="message-circle" class="icon"></i></div><strong>Тут починається ваша розмова</strong><p>Простого «Привіт!» цілком достатньо.</p></div>';
  let lastDate='';
  let html=state.hasOlderMessages?'<button type="button" class="btn btn-secondary history-load" id="loadEarlierButton" onclick="loadEarlierMessages()"><i data-lucide="arrow-up" class="icon-sm"></i>Раніші повідомлення</button>':'';
  html+=state.messages.map(message=>{
    const mine=message.sender_id===state.user.id,text=message.content||'',img=message._imageUrl||null;
    const dateKey=new Date(message.created_at).toLocaleDateString('uk-UA');
    const divider=dateKey!==lastDate?`<div class="date-divider">${esc(messageDay(message.created_at))}</div>`:'';lastDate=dateKey;
    const status=message._failed?'Не надіслано':message._uploading?'Завантаження фото…':message._pending?'Надсилання…':'';
    return `${divider}<div class="message-row ${mine?'mine':''}" data-message-id="${esc(message.id)}"><div class="message ${message._failed?'failed':''}">${message.image_path||img?(img?`<button type="button" class="message-image-wrap" onclick="openImageViewer(${esc(jsString(img))})" aria-label="Відкрити фото"><img class="message-image" src="${esc(img)}" alt="Фото в розмові" loading="lazy" onerror="refreshImageMessage(this,'${esc(message.id)}','${esc(message.image_path||'')}')"></button>`:'<div class="message-image-loading" role="status" aria-label="Завантаження фото"></div>'):''}${text?`<div class="message-text">${esc(text)}</div>`:''}<div class="message-time"><span>${formatTime(message.created_at)}</span>${status?`<span>· ${status}</span>`:mine?'<i data-lucide="check" class="icon-sm" aria-label="Надіслано"></i>':''}</div>${message._failed?`<button type="button" class="message-recover" onclick="recoverMessage('${esc(message.id)}')">Повернути в чернетку</button>`:''}</div></div>`;
  }).join('');return html;
}

async function loadChats(){

  const root=
    qs("#chatList");


  if(!root){
    return;
  }


  const uid=
    state.user.id;


  const requestId=
    ++state.chatListRequest;


  const {
    data,
    error
  }=
    await sb

      .from(
        "direct_conversations"
      )

      .select("*")

      .or(
        `user1_id.eq.${uid},user2_id.eq.${uid}`
      )

      .order(
        "updated_at",
        {
          ascending:false
        }
      );


  if(error){

    if(
      requestId!==
      state.chatListRequest
      ||
      uid!==state.user?.id
    ){
      return;
    }

    root.innerHTML=`
      <div class="empty">

        <strong>
          Не вдалося завантажити чати
        </strong>

        <p>
          Перевірте з'єднання та відкрийте розділ ще раз.
        </p>

      </div>
    `;

    return;

  }


  const chats=
    data
    ||
    [];


  const ids=
    chats.map(
      chat=>

        chat.user1_id===uid

          ?chat.user2_id

          :chat.user1_id
    );


  let users=[];


  if(ids.length){

    const {
      data:profiles,
      error:profilesError
    }=
      await sb

        .from("profiles")

        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )

        .in(
          "id",
          ids
        );


    users=
      profiles
      ||
      [];


    if(profilesError){

      console.error(
        "CHAT PROFILES ERROR",
        profilesError
      );

    }

  }


  const map=
    Object.fromEntries(

      users.map(
        user=>[
          user.id,
          user
        ]
      )

    );


  const withPreview=
    await Promise.all(

      chats.map(
        async chat=>{

          const otherId=
            chat.user1_id===uid

              ?chat.user2_id

              :chat.user1_id;


          let latest=null;


          try{

            const {
              data:lastMessage
            }=
              await sb

                .from("messages")

                .select(
                  "content,image_path,created_at,sender_id"
                )

                .eq(
                  "conversation_id",
                  chat.id
                )

                .order(
                  "created_at",
                  {
                    ascending:false
                  }
                )

                .limit(1)

                .maybeSingle();


            latest=
              lastMessage;

          }catch{}


          return {

            ...chat,

            other:
              map[otherId]
              ||
              {
                id:otherId,
                login:"user",
                username:"Користувач",
                public_id:"------",
                avatar_url:null,
                banner_url:null
              },

            latest

          };

        }
      )

    );


  if(
    requestId!==
    state.chatListRequest
    ||
    uid!==state.user?.id
  ){

    return;

  }


  state.conversations=
    withPreview;


  renderChatList();

}


function renderChatList(){
  const root=qs('#chatList');if(!root)return;
  const query=state.chatQuery.trim().toLocaleLowerCase('uk-UA');
  const chats=state.conversations.filter(c=>(state.chatFilter!=='online'||isOnline(c.other?.id))&&[c.other?.username,c.other?.login,c.other?.public_id].filter(Boolean).join(' ').toLocaleLowerCase('uk-UA').includes(query));
  if(qs('#allChatCount'))qs('#allChatCount').textContent=state.conversations.length;
  if(qs('#onlineChatCount'))qs('#onlineChatCount').textContent=state.conversations.filter(c=>isOnline(c.other?.id)).length;
  if(qs('#chatResultCount'))qs('#chatResultCount').textContent=chats.length||'';
  if(!chats.length){
    const noChats=!state.conversations.length;
    root.innerHTML=`<div class="empty"><div class="empty-icon"><i data-lucide="${query?'search':'messages-square'}" class="icon"></i></div><strong>${query?'Нічого не знайшлося':noChats?'Поки що тихо':'Зараз нікого в мережі'}</strong><p>${query?'Спробуйте інше ім’я, логін або ID.':noChats?'Знайдіть свою людину й почніть першу розмову.':'Можна написати зараз — повідомлення чекатиме на співрозмовника.'}</p><button type="button" class="btn ${noChats?'btn-primary':'btn-secondary'}" onclick="${query?"clearChatSearch()":noChats?'openUserSearch()':"setChatFilter('all')"}">${query?'Очистити пошук':noChats?'Знайти людину':'Показати всі чати'}</button></div>`;
  }else root.innerHTML=chats.map(chat=>{
    let preview=chat.latest?.image_path?'Фото'+(chat.latest.content?' · '+chat.latest.content:''):chat.latest?.content||'Почніть розмову';
    if(chat.latest?.sender_id===state.user?.id)preview='Ви: '+preview;
    const draft=state.drafts[chat.id];
    return `<button type="button" class="chat-item ${state.activeConversation?.id===chat.id?'active':''}" ${state.activeConversation?.id===chat.id?'aria-current="true"':''} data-chat-id="${esc(chat.id)}" onclick="openChat('${esc(chat.id)}','${esc(chat.other?.id||'')}')">${avatarStatus(chat.other)}<div class="chat-item-content"><div class="chat-item-row"><span class="chat-name">${esc(chat.other?.username||chat.other?.login||'Користувач')}</span><span class="chat-time">${chatListTime(chat.latest?.created_at||chat.updated_at)}</span></div><div class="chat-preview">${draft?'<span class="draft-label">Чернетка: </span>'+esc(draft):esc(preview)}</div></div></button>`;
  }).join('');
  refreshIcons();refreshOnlineIndicators();
}

async function createChat(
  userId
){

  const {

  }=
    await sb.rpc(

      "get_or_create_direct_conversation",

  const conversationId=
    Array.isArray(data)

      ?(

async function stopChatChannel(){

  state.chatChannelReady=
    false;


  if(
    state.messageChannel
  ){

    try{

      await sb.removeChannel(
        state.messageChannel
      );

    }catch{}


    state.messageChannel=
      null;

  }

}


async function setupChatChannel(
  conversationId,
  requestId=null
){

  await stopChatChannel();


  if(
    requestId!==null
    &&
    requestId!==
    state.chatOpenRequest
  ){

    return false;

  }


  const channel=
    sb.channel(

      "chat:"
      +
      conversationId,

      {
        config:{
          broadcast:{
            self:false
          }
        }
      }

    );


  state.messageChannel=
    channel;


  channel.on(

    "postgres_changes",

    {
      event:"INSERT",

      schema:"public",

      table:"messages",

      filter:
        `conversation_id=eq.${conversationId}`
    },

    async payload=>{

      if(
        state.activeConversation?.id!==
        conversationId
      ){

        return;

      }

      const incoming=
        await hydrateMessageMedia(
          payload.new
        );


      if(
        state.activeConversation?.id!==
        conversationId
      ){

        return;

      }


      const index=
        state.messages
          .findIndex(
            message=>
              message.id===
              incoming.id
          );


      if(index>=0){

        state.messages[index]=
          incoming;

      }else{

        state.messages
          .push(
            incoming
          );

      }


      const messageRoot=qs("#messages");
      const nearBottom=!messageRoot || messageRoot.scrollHeight-messageRoot.scrollTop-messageRoot.clientHeight<150;
      if(!nearBottom)state.unseenMessages=true;
      refreshMessages(nearBottom);


      refreshConversationPreview(
        incoming
      );

    }

  );


  channel.on(

    "broadcast",

    {
      event:"typing"
    },

    payload=>{

      const data=
        payload.payload||{};


      if(
        data.user_id===
        state.user.id
      ){

        return;

      }


      if(
        data.conversation_id!==
        state.activeConversation?.id
      ){

        return;

      }


      showTypingIndicator(
        data.user_id,
        Boolean(
          data.typing
        )
      );

    }

  );


  channel.subscribe(
    status=>{

      state.chatChannelReady=
        status===
        "SUBSCRIBED";

    }
  );


  return true;

}

async function openChat(
  conversationId,
  userId
 ){
  saveDraft();
  if(state.activeConversation?.id===conversationId && state.mobileChatOpen && qs("#messages"))return;

  const requestId=
    ++state.chatOpenRequest;

  await stopTyping();


  clearSelectedImage();


  if(
    state.typingHideTimer
  ){

    clearTimeout(
      state.typingHideTimer
    );

    state.typingHideTimer=
      null;

  }


  state.typingUserId=
    null;


  let user=
    state.conversations

      .find(
        chat=>
          chat.id===
          conversationId
      )

      ?.other;


  if(!user){

    const {data}=
      await sb

        .from("profiles")

        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )

        .eq(
          "id",
          userId
        )

        .maybeSingle();


    user=
      data;

  }


  if(
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  if(!user){

    toast(
      "Користувача не знайдено",
      "error"
    );

    return;

  }


  const {
    data,
    error
  }=
    await sb

      .from("messages")

      .select("*")

      .eq(
        "conversation_id",
        conversationId
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      )

      .order("id",{ascending:false})
      .limit(500);


  if(
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  if(error){

    toast(
      "Не вдалося відкрити чат",
      "error"
    );

    return;

  }


  const hydratedMessages=
    await Promise.all(

      (data||[]).slice().reverse()
        .map(
          hydrateMessageMedia
        )

    );


  if(
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  state.activeConversation={
    id:
      conversationId
  };


  state.activeChatUser=
    user;


  state.mobileChatOpen=
    true;


  const serverIds=new Set(hydratedMessages.map(m=>m.id));
  state.messages=[...hydratedMessages,...Object.values(state.outbox[conversationId]||{}).filter(m=>!serverIds.has(m.id))].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  state.hasOlderMessages=(data||[]).length===500;
  state.historyCursor=(data||[]).at(-1)||null;
  state.unseenMessages=false;


  const channelReady=
    await setupChatChannel(
      conversationId,
      requestId
    );


  if(
    !channelReady
    ||
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  renderChats();


  setTimeout(
    scrollMessages,
    40
  );

}

}

function refreshMessages(scroll=false){
  const root=qs('#messages');if(!root)return;

  root.innerHTML=messagesMarkup();refreshIcons();

}

}

function messageKey(event){
  if(event.isComposing)return;
  if(event.key==='Enter'&&!event.shiftKey&&(window.innerWidth>760||event.ctrlKey||event.metaKey)){event.preventDefault();sendMessage();}
}

async function sendMessage(){
  if(!state.activeConversation||state.sendingMessage)return;
  const conversationId=state.activeConversation.id,userId=state.user.id;
  const input=qs('#messageInput'),content=input?.value.trim()||'',imageFile=state.selectedImage;
  if(!content&&!imageFile)return;
  if(!navigator.onLine){toast('Немає інтернету. Надішліть чернетку, коли з’єднання відновиться.','error');return;}
  const id=crypto.randomUUID(),createdAt=new Date().toISOString(),localImageUrl=state.selectedImagePreview;
  const isStillOpen=()=>state.user?.id===userId&&state.activeConversation?.id===conversationId;
  const sameUser=()=>state.user?.id===userId;
  const optimistic={id,conversation_id:conversationId,sender_id:userId,content:content||null,image_path:imageFile?'pending':null,created_at:createdAt,_imageUrl:localImageUrl,_retryFile:imageFile,_uploading:Boolean(imageFile),_pending:!imageFile,_failed:false};
  state.sendingMessage=true;state.drafts[conversationId]='';
  state.outbox[conversationId]??={};state.outbox[conversationId][id]=optimistic;
  state.messages.push(optimistic);
  if(input){input.value='';input.style.height='44px';}
  state.selectedImage=null;state.selectedImagePreview=null;
  if(qs('#chatImageInput'))qs('#chatImageInput').value='';
  updateComposerPreview();refreshMessages(true);updateComposerState();
  // A typing broadcast must never delay capturing and clearing this draft.
  stopTyping().catch(()=>{});
  try{
    let imagePath=null;
    if(imageFile){
      imagePath=await uploadChatImage(imageFile,conversationId);
      if(sameUser()){
        const uploading={...optimistic,image_path:imagePath,_uploading:false,_pending:true};
        state.outbox[conversationId][id]=uploading;
        if(isStillOpen()){state.messages=state.messages.map(m=>m.id===id?uploading:m);refreshMessages(false);}
      }
    }
    const {data:inserted,error}=await sb.from('messages').insert({id,conversation_id:conversationId,sender_id:userId,content:content||null,image_path:imagePath}).select().single();
    if(error)throw error;
    let finalMessage;
    try{finalMessage=await hydrateMessageMedia(inserted);}catch{finalMessage={...inserted,_imageUrl:localImageUrl};}
    if(imageFile&&!finalMessage._imageUrl&&localImageUrl)finalMessage._imageUrl=localImageUrl;
    if(sameUser()){
      delete state.outbox[conversationId]?.[id];
      if(isStillOpen()){state.messages=state.messages.map(m=>m.id===id?finalMessage:m);refreshMessages(false);}
      refreshConversationPreview(finalMessage);
    }
    if(localImageUrl&&finalMessage._imageUrl!==localImageUrl)URL.revokeObjectURL(localImageUrl);
  }catch(error){
    console.error('SEND ERROR',error);
    if(sameUser()){
      const failed={...optimistic,_pending:false,_uploading:false,_failed:true};
      state.outbox[conversationId][id]=failed;
      if(isStillOpen()){state.messages=state.messages.map(m=>m.id===id?failed:m);refreshMessages(false);}
      toast('Повідомлення не надіслано. Його можна повернути в чернетку.','error');
    }
  }finally{
    state.sendingMessage=false;updateComposerState();
    if(isStillOpen()&&window.innerWidth>760&&!qs('#modalRoot')?.children.length)qs('#messageInput')?.focus();
  }
}

function refreshConversationPreview(
  message
){

  const chat=
    state.conversations
      .find(
        item=>
          item.id===
          message.conversation_id
      );


  if(!chat){

    return;

  }


  chat.latest={

    content:
      message.content,

    image_path:
      message.image_path,

    created_at:
      message.created_at,

    sender_id:
      message.sender_id

  };


  chat.updated_at=
    message.created_at;


  state.conversations.sort(

    (a,b)=>

      new Date(
        b.latest?.created_at
        ||
        b.updated_at
      )

      -

      new Date(
        a.latest?.created_at
        ||
        a.updated_at
      )

  );


  renderChatList();

}

async function saveAdminLogo(){

  const file=
    qs("#adminLogo")
      ?.files?.[0];


  if(!file){

    toast(
      "Оберіть зображення",
      "error"
    );

    return;

  }


  const allowed=[
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    toast(
      "Дозволені JPG, PNG, WEBP або GIF",
      "error"
    );

    return;

  }


  if(
    file.size>
    5*1024*1024
  ){

    toast(
      "Логотип має бути до 5 МБ",
      "error"
    );

    return;

  }


  const button=
    qs("#logoButton");


  setLoading(
    button,
    true
  );


  try{

    const ext=
      imageExtension(file);


    const path=
      `logo-${
        Date.now()
      }.${ext}`;


    const {error}=
      await sb.storage

        .from("branding")

        .upload(

          path,

          file,

          {
            upsert:true
          }

        );


    if(error){

      throw error;

    }


    const {data}=
      sb.storage

        .from("branding")

        .getPublicUrl(path);


    const url=
      data.publicUrl;


    const {
      error:updateError
    }=
      await sb

        .from(
          "app_settings"
        )

        .upsert({

          id:1,

          logo_url:
            url,

          updated_at:
            new Date()
              .toISOString()

        });


    if(updateError){

      throw updateError;

    }


    state.logoUrl=
      url;


    render();


    toast(
      "Логотип змінено",
      "success"
    );


  }catch(error){

    console.error(error);


    toast(
      error.message
      ||
      "Не вдалося змінити логотип",
      "error"
    );


  }finally{

    setLoading(
      button,
      false
    );

  }

}

function switchAuth(mode){

function togglePassword(button){

function saveDraft(){const input=qs('#messageInput');if(input&&state.activeConversation)state.drafts[state.activeConversation.id]=input.value;}
function composerChanged(input){saveDraft();composerTyping();resizeComposer(input);updateComposerState();}
function updateComposerState(){
  const input=qs('#messageInput'),button=qs('#sendMessageButton');if(button)button.disabled=state.sendingMessage||(!input?.value.trim()&&!state.selectedImage);
  const count=qs('#composerCount');if(count)count.textContent=input?.value.length>3200?`${input.value.length} / 4000`:'';
}
function restoreComposer(){const input=qs('#messageInput');if(input)resizeComposer(input);updateComposerPreview();updateComposerState();}
function messageDay(value){
  const date=new Date(value),today=new Date(),yesterday=new Date();yesterday.setDate(today.getDate()-1);
  if(date.toDateString()===today.toDateString())return 'Сьогодні';if(date.toDateString()===yesterday.toDateString())return 'Учора';
  return date.toLocaleDateString('uk-UA',{day:'numeric',month:'long',...(date.getFullYear()!==today.getFullYear()?{year:'numeric'}:{})});
}
function chatListTime(value){
  if(!value)return '';const date=new Date(value);if(Number.isNaN(date.getTime()))return '';
  if(date.toDateString()===new Date().toDateString())return formatTime(value);
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);if(date.toDateString()===yesterday.toDateString())return 'Учора';
  return date.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',...(date.getFullYear()!==new Date().getFullYear()?{year:'2-digit'}:{})});
}
function updateJumpButton(){
  const root=qs('#messages'),button=qs('#jumpLatest');if(!root||!button)return;
  const away=root.scrollHeight-root.scrollTop-root.clientHeight>150;button.classList.toggle('hidden',!away);
  if(!away)state.unseenMessages=false;button.querySelector('span').textContent=state.unseenMessages?'Нові повідомлення':'До останніх';
}
async function loadEarlierMessages(){
  if(state.loadingHistory||!state.activeConversation||!state.messages.length)return;
  const id=state.activeConversation.id,root=qs('#messages'),button=qs('#loadEarlierButton'),cursor=state.historyCursor||state.messages[0];
  state.loadingHistory=true;setLoading(button,true);
  try{
    const {data,error}=await sb.from('messages').select('*').eq('conversation_id',id).or(`created_at.lt.${cursor.created_at},and(created_at.eq.${cursor.created_at},id.lt.${cursor.id})`).order('created_at',{ascending:false}).order('id',{ascending:false}).limit(100);
    if(error)throw error;const items=await Promise.all((data||[]).slice().reverse().map(hydrateMessageMedia));
    if(state.activeConversation?.id!==id||!root?.isConnected)return;
    const oldHeight=root.scrollHeight,oldTop=root.scrollTop;state.hasOlderMessages=(data||[]).length===100;state.historyCursor=(data||[]).at(-1)||cursor;
    const known=new Set(state.messages.map(m=>m.id));state.messages=[...items.filter(m=>!known.has(m.id)),...state.messages];
    refreshMessages();root.scrollTop=oldTop+(root.scrollHeight-oldHeight);updateJumpButton();
  }catch(error){toast('Не вдалося завантажити попередні повідомлення. Спробуйте ще раз.','error');}
  finally{state.loadingHistory=false;setLoading(button,false);}
}
function recoverMessage(id){
  const message=state.messages.find(m=>m.id===id),input=qs('#messageInput');if(!message||!input)return;
  if(input.value.trim()||state.selectedImage){toast('Спочатку надішліть або очистіть поточну чернетку.');input.focus();return;}
  input.value=message.content||'';
  if(message._retryFile){state.selectedImage=message._retryFile;state.selectedImagePreview=URL.createObjectURL(message._retryFile);}
  saveDraft();restoreComposer();input.focus();toast('Повідомлення повернуто в чернетку. Можна відредагувати й надіслати.');
}
async function copyProfileId(){
  const id=state.profile?.public_id;if(!id||id==='------'){toast('Спочатку додайте ID у редакторі профілю.');return;}
  try{await navigator.clipboard.writeText(String(id));toast('ID скопійовано','success');}
  catch{modal('Ваш особистий ID',`<div class="field"><label for="copyIdInput">Скопіюйте цей ID і поділіться ним</label><input id="copyIdInput" class="input" readonly value="${esc(id)}" onclick="this.select()"></div>`);requestAnimationFrame(()=>qs('#copyIdInput')?.select());}
}
function confirmLogout(){modal('Вийти з акаунта?','<p class="user-search-help">Повідомлення залишаться у вашому акаунті. Незбережені чернетки буде очищено.</p><div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Залишитися</button><button type="button" class="btn btn-danger" onclick="performLogout(this)">Вийти</button></div>');}
async function performLogout(button){setLoading(button,true);try{await logout();state.drafts={};closeModal();}catch{toast('Не вдалося вийти. Спробуйте ще раз.','error');}finally{setLoading(button,false);}}
function openShortcuts(){modal('Клавіші та підказки',`<div class="shortcut-row"><span>Знайти чат</span><kbd>Ctrl / ⌘ + K</kbd></div><div class="shortcut-row"><span>Нова розмова</span><kbd>Ctrl / ⌘ + Shift + N</kbd></div><div class="shortcut-row"><span>Надіслати з комп’ютера</span><kbd>Enter</kbd></div><div class="shortcut-row"><span>Новий рядок</span><kbd>Shift + Enter</kbd></div><div class="shortcut-row"><span>Закрити вікно / повернутися до чатів</span><kbd>Esc</kbd></div><p class="user-search-help" style="margin:20px 0 0">Текст чернетки зберігається, поки ви перемикаєтеся між розмовами. На телефоні Enter додає новий рядок.</p>`);}
function updateConnection(){
  const online=navigator.onLine;qs('#connectionBanner')?.classList.toggle('hidden',online);qs('.connection-dot')?.classList.toggle('offline',!online);const label=qs('#connectionText');if(label)label.textContent=online?'На зв’язку':'Немає інтернету';
}
window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented)return;
  const overlay=qs('#imageViewerRoot')?.firstElementChild||qs('#modalRoot')?.firstElementChild;
  if(overlay&&event.key==='Tab'){
    const focusable=[...overlay.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled):not([type=hidden]),textarea:not(:disabled),select:not(:disabled),[tabindex="0"]')].filter(el=>el.getClientRects().length);
    const first=focusable[0],last=focusable[focusable.length-1];if(!first)return;
    if(event.shiftKey&&(document.activeElement===first||!overlay.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!overlay.contains(document.activeElement))){event.preventDefault();first.focus();}
  }
  if(overlay||!state.user)return;
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();saveDraft();if(state.page!=='chats'){state.page='chats';state.mobileChatOpen=false;render();}else if(window.innerWidth<=760&&state.mobileChatOpen){closeMobileChat();}requestAnimationFrame(()=>qs('#chatSearchInput')?.focus());}
  if((event.ctrlKey||event.metaKey)&&event.shiftKey&&event.key.toLowerCase()==='n'){event.preventDefault();openUserSearch();}
  if(event.key==='Escape'&&window.innerWidth<=760&&state.page==='chats'&&state.mobileChatOpen)closeMobileChat();
});
const overlayObserver=new MutationObserver(()=>{
  const active=Boolean(qs('#modalRoot')?.children.length||qs('#imageViewerRoot')?.children.length);qs('#app').inert=active;
});
overlayObserver.observe(qs('#modalRoot'),{childList:true});overlayObserver.observe(qs('#imageViewerRoot'),{childList:true});

init();

</script>
